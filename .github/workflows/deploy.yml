name: Deploy to EC2 (backend container + frontend via host nginx)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
      - "deploy/nginx/**"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  ECR_REPOSITORY: rag-backend
  IMAGE_TAG: ${{ github.sha }}
  FRONTEND_DIR: /var/www/rag-frontend

jobs:
  # ───────────────────────────────────────────────────────────────
  # Frontend: build static assets and copy to the EC2 host (nginx root)
  # ───────────────────────────────────────────────────────────────
  frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Empty API URL -> frontend calls relative /api/v1/... (same-origin via nginx)
          VITE_API_URL: ""
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Copy dist to EC2 host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: ${{ env.FRONTEND_DIR }}
          strip_components: 2
          # No rm: deleting/recreating the dir needs write on the parent
          # (/var/www, root-owned). Overwrite files in place instead; build
          # assets are content-hashed so stale files are harmless.
          overwrite: true

  # ───────────────────────────────────────────────────────────────
  # Backend: build image, push to ECR, pull & run on EC2 behind nginx
  # ───────────────────────────────────────────────────────────────
  backend:
    name: Build, Push & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Runner is linux/amd64, matching the x86_64 EC2 target.
      - name: Build, tag, and push image to ECR
        run: |
          docker build \
            -f backend/Dockerfile.prod \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./backend

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
          script: |
            set -e

            # Authenticate Docker to ECR
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            # Pull latest image
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

            # Replace the running container
            docker stop rag-backend || true
            docker rm rag-backend || true

            # Bind to localhost only; host nginx proxies /api -> 127.0.0.1:8000
            docker run -d \
              --name rag-backend \
              --restart unless-stopped \
              -p 127.0.0.1:8000:8000 \
              -v fastembed_cache:/app/.fastembed_cache \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
              -e SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e FASTEMBED_CACHE_PATH=/app/.fastembed_cache \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest

            echo "Waiting for backend health (model load/download may take a few minutes on first deploy)..."
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
                echo "Backend healthy after ~$((i*3))s"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "Backend did not become healthy in time. Recent logs:"
                docker logs --tail 50 rag-backend || true
                exit 1
              fi
              sleep 3
            done

            # Reclaim disk from old image layers
            docker image prune -f
