name: Deploy to EC2 (backend container + frontend via host nginx)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
      - "deploy/nginx/**"
      - "deploy/server/**"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rag-backend
  IMAGE_TAG: ${{ github.sha }}
  FRONTEND_DIR: /var/www/rag-frontend
  # Shared EC2 (another app on :80): set repo Variables → RAG_NGINX_PORT=8080, RAG_NGINX_COEXIST=1
  # Dedicated EC2: RAG_NGINX_PORT=80, RAG_NGINX_COEXIST=0 (or omit both)
  RAG_NGINX_PORT: ${{ vars.RAG_NGINX_PORT || '8080' }}
  RAG_NGINX_COEXIST: ${{ vars.RAG_NGINX_COEXIST || '1' }}

jobs:
  # ───────────────────────────────────────────────────────────────
  # Frontend: build static assets and copy to the EC2 host (nginx root)
  # ───────────────────────────────────────────────────────────────
  frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Empty API URL -> frontend calls relative /api/v1/... (same-origin via nginx)
          VITE_API_URL: ""
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Copy dist to EC2 host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/"
          target: ${{ env.FRONTEND_DIR }}
          strip_components: 2
          overwrite: true

      - name: Select nginx config for port ${{ env.RAG_NGINX_PORT }}
        run: |
          if [ "${{ env.RAG_NGINX_PORT }}" = "8080" ]; then
            cp deploy/nginx/rag-port8080.conf deploy/nginx/rag.deploy.conf
          else
            cp deploy/nginx/rag.conf deploy/nginx/rag.deploy.conf
          fi

      - name: Copy nginx config to EC2 host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/nginx/rag.deploy.conf,deploy/server/apply-nginx.sh"
          target: "/tmp"
          overwrite: true

      - name: Apply nginx on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          RAG_NGINX_COEXIST: ${{ env.RAG_NGINX_COEXIST }}
          RAG_SMOKE_PORT: ${{ env.RAG_NGINX_PORT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RAG_NGINX_COEXIST,RAG_SMOKE_PORT
          script: |
            chmod +x /tmp/apply-nginx.sh
            bash /tmp/apply-nginx.sh /tmp/rag.deploy.conf

  # ───────────────────────────────────────────────────────────────
  # Backend: build image, push to GHCR, pull & run on EC2 behind nginx
  # ───────────────────────────────────────────────────────────────
  backend:
    name: Build, Push & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runner is linux/amd64, matching the x86_64 EC2 target.
      - name: Build, tag, and push image to GHCR
        run: |
          docker build \
            -f backend/Dockerfile.prod \
            -t $IMAGE_NAME:$IMAGE_TAG \
            -t $IMAGE_NAME:latest \
            ./backend

          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:latest

      - name: Verify GHCR pull credentials
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "$GHCR_PAT" ]; then
            echo "::error::Repository secret GHCR_PAT is missing or empty."
            echo "Create a GitHub PAT with read:packages and add it as GHCR_PAT."
            echo "See deploy/server/README.md — or make the GHCR package public and skip login."
            exit 1
          fi

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME,GHCR_PAT,GHCR_USER
          script: |
            set -e

            # Pull private GHCR images (PAT with read:packages — see deploy/server/README.md)
            if [ -z "$GHCR_PAT" ]; then
              echo "ERROR: GHCR_PAT was not forwarded to the host. Check workflow envs."
              exit 1
            fi
            echo "$GHCR_PAT" | docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin

            docker stop rag-backend 2>/dev/null || true
            docker rm rag-backend 2>/dev/null || true
            # Drop stale partial model downloads; weights are baked into the image now.
            docker volume rm fastembed_cache 2>/dev/null || true
            docker system prune -af

            echo "Disk before pull:"
            df -h / | tail -1
            AVAIL_KB=$(df / | awk 'NR==2 {print $4}')
            if [ "$AVAIL_KB" -lt 3145728 ]; then
              echo "WARNING: less than 3 GB free on /. Run docker system prune -af or expand EBS (see deploy/aws/ec2-host-setup.md)."
            fi

            docker pull "$IMAGE_NAME:latest"

            # Bind to localhost only; host nginx proxies /api -> 127.0.0.1:8000
            docker run -d \
              --name rag-backend \
              --restart unless-stopped \
              -p 127.0.0.1:8000:8000 \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
              -e SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e FASTEMBED_CACHE_PATH=/app/.fastembed_cache \
              -e 'CORS_ORIGINS=["http://${{ secrets.EC2_HOST }}${{ env.RAG_NGINX_PORT != '80' && format(':{}', env.RAG_NGINX_PORT) || '' }}"]' \
              "$IMAGE_NAME:latest"

            echo "Waiting for backend health (model load into RAM may take a few minutes on first deploy)..."
            for i in $(seq 1 120); do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
                echo "Backend healthy after ~$((i*3))s"
                break
              fi
              if [ "$i" -eq 120 ]; then
                echo "Backend did not become healthy in time. Recent logs:"
                docker logs --tail 50 rag-backend || true
                exit 1
              fi
              sleep 3
            done

            docker image prune -f
