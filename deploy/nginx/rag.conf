# Host nginx for the RAG app (single EC2, HTTP only / MVP).
#
# Install on EC2:
#   sudo cp deploy/nginx/rag.conf /etc/nginx/conf.d/rag.conf
#   sudo rm -f /etc/nginx/conf.d/default.conf   # remove default if present
#   sudo nginx -t && sudo systemctl reload nginx
#
# Serves the built frontend from /var/www/rag-frontend and reverse-proxies
# /api/ to the backend container bound on 127.0.0.1:8000.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name yyrag.uz www.yyrag.uz;

    root /var/www/rag-frontend;
    index index.html;

    # Allow document uploads (backend MAX_UPLOAD_SIZE_MB defaults to 50)
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # SPA routing: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API + SSE chat -> backend container. Full URI is preserved
    # (no trailing slash on proxy_pass), so /api/v1/... maps 1:1.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming for the SSE chat endpoint (/api/v1/chat)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
