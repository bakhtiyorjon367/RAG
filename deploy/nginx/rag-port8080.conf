# RAG on a separate port when another app already owns :80 (e.g. /var/www/html/dist).
#
#   sudo cp deploy/nginx/rag-port8080.conf /etc/nginx/conf.d/rag.conf
#   RAG_NGINX_COEXIST=1 bash deploy/server/apply-nginx.sh /path/to/rag-port8080.conf
#
# Open: http://<EC2_IP>:8080/
# Security group: allow inbound TCP 8080 (in addition to 80 for the other app).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/rag-frontend;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
