version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    # Set in Amplify Console → Environment variables:
    # VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_API_URL
